<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OEA — Ton assistant de révision avec IA</title>
<meta name="description" content="OEA transforme les photos de tes cours en fiches de révision, quiz et flashcards avec l’IA.">
<meta name="robots" content="index,follow">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#dbeafe);color:#172033;min-height:100vh}header{padding:25px 6%;font-size:25px;font-weight:900}header span{color:#635bff}main{max-width:1050px;margin:auto;padding:10px 20px 50px}.hero{text-align:center;padding:25px 0 30px;animation:up .6s}h1{font-size:clamp(38px,6vw,64px);margin:0 0 12px;letter-spacing:-3px}h1 span{color:#635bff}.hero p{color:#667085;font-size:19px}.upload,.out{background:#fff;border-radius:25px;padding:35px;box-shadow:0 15px 45px #0001}.upload{text-align:center;border:2px dashed #b9b5ff;transition:.2s}.upload.drag{transform:scale(1.02);border-color:#635bff}.icon{font-size:52px;animation:float 3s infinite}.choose{display:inline-block;background:#635bff;color:#fff;padding:14px 22px;border-radius:12px;font-weight:bold;cursor:pointer}input{display:none}.files{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:15px}.file{background:#eef2ff;padding:8px 12px;border-radius:9px;font-size:13px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.action{background:#fff;border:0;border-radius:20px;padding:25px;cursor:pointer;box-shadow:0 10px 30px #0001;transition:.2s}.action:hover{transform:translateY(-5px)}.action:disabled{opacity:.55;cursor:wait}.action b{display:block;font-size:19px;margin-top:8px}.action small{color:#667085}.out{display:none;animation:pop .3s}.out.show{display:block}.notice{background:#fff7ed;padding:12px;border-radius:10px;color:#9a3412;margin-bottom:18px}.markdown{line-height:1.7}.markdown h2,.markdown h3{margin-top:22px}.flashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.flash{height:160px;perspective:700px;cursor:pointer}.inner{width:100%;height:100%;position:relative;transition:.5s;transform-style:preserve-3d}.flash.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:15px;padding:18px;display:flex;align-items:center;justify-content:center;text-align:center}.front{background:#f3f1ff;font-weight:bold}.back{background:#ecfdf3;transform:rotateY(180deg)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans,.next{padding:14px;border-radius:11px;cursor:pointer;font-size:16px}.ans{background:white;border:2px solid #e5e7eb;text-align:left}.next{background:#111827;color:white;border:0;margin-top:16px}.feedback{font-weight:bold;min-height:30px;margin:15px 0}.spinner{margin:20px auto;width:32px;height:32px;border:4px solid #ddd;border-top-color:#635bff;border-radius:50%;animation:spin .8s linear infinite}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.restart{border:0;background:#eef2ff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:bold}.status{color:#667085}.error{background:#fef2f2;color:#991b1b;padding:14px;border-radius:12px}li{margin:8px 0}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}@media(max-width:650px){.actions,.answers{grid-template-columns:1fr}.upload{padding:25px}}
</style>
</head>
<body>
<header><span>OEA</span> ✨</header>
<main>
<section class="hero"><h1>Ton cours devient <span>un outil de révision</span></h1><p>Avec <b>OEA</b>, prends tes feuilles en photo et l'IA crée ton cours, ton quiz ou tes flashcards.</p></section>
<section class="upload" id="drop"><div class="icon">📸</div><h2>Envoie ton cours</h2><p>Glisse tes photos ici ou sélectionne plusieurs pages.</p><label class="choose">📁 Choisir mes photos<input id="files" type="file" accept="image/*" multiple></label><div class="files" id="filesList"></div></section>
<section class="actions">
<button class="action" onclick="generate('course')">🧠<b>Faire un cours</b><small>Résumé intelligent par IA</small></button>
<button class="action" onclick="generate('quiz')">🎯<b>Faire des questions</b><small>20 questions personnalisées</small></button>
<button class="action" onclick="generate('cards')">🃏<b>Faire des flashcards</b><small>15 cartes de mémorisation</small></button>
</section>
<section class="out" id="out"></section>
</main>
<script>
let files=[],quiz=[],qi=0,score=0;
const $=id=>document.getElementById(id),drop=$("drop");
$("files").onchange=e=>add([...e.target.files]);
function add(x){files.push(...x.filter(f=>f.type.startsWith('image/')));$("filesList").innerHTML=files.map(f=>`<div class=file>📄 ${esc(f.name)}</div>`).join("")}
["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("drag")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("drag")}));
drop.ondrop=e=>add([...e.dataTransfer.files]);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function md(s){return esc(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>').replace(/^[-•] (.*)$/gm,'<li>$1</li>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}
async function imageData(file){return new Promise((resolve,reject)=>{const img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{const max=1600;let w=img.width,h=img.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function generate(action){
 const out=$("out");out.className="out show";
 if(!files.length){out.innerHTML='<div class=error>📸 Ajoute d’abord au moins une photo de ton cours.</div>';return}
 document.querySelectorAll('.action').forEach(b=>b.disabled=true);
 out.innerHTML='<div class=spinner></div><p style="text-align:center">🤖 L’IA lit tes pages et prépare ta révision…</p>';
 try{const images=[];for(const f of files.slice(0,8)) images.push(await imageData(f));
   const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,images})});
   const data=await r.json();if(!r.ok)throw new Error(data.error||'Erreur serveur');
   if(action==='course') showCourse(data.text); else if(action==='cards') showCards(data.text); else showQuiz(data.text);
 }catch(e){out.innerHTML=`<div class=error>❌ ${esc(e.message)}<br><br>Vérifie que le site est déployé avec le serveur IA et que la clé API est bien configurée.</div>`}
 finally{document.querySelectorAll('.action').forEach(b=>b.disabled=false)}
}
function safeJSON(raw){
  try{return JSON.parse(raw)}catch(e){
    const cleaned=String(raw).replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
    try{return JSON.parse(cleaned)}catch(e2){throw new Error('L’IA a renvoyé une réponse invalide. Réessaie avec des photos plus nettes.')}
  }
}
function showCourse(text){$("out").innerHTML=`<div class=topline><h2>🧠 Ton cours créé par l’IA</h2><button class=restart onclick="location.reload()">🔄 Recommencer</button></div><div class="markdown">${md(text)}</div>`}
function showCards(raw){let d=safeJSON(raw),c=d.cards||[];$("out").innerHTML=`<div class=topline><div><h2>🃏 Tes flashcards IA</h2><p>Clique sur une carte pour la retourner.</p></div><button class=restart onclick="location.reload()">🔄 Recommencer</button></div><div class=flashgrid>${c.map((x,i)=>`<div class=flash onclick="this.classList.toggle('flip')"><div class=inner><div class="face front">${esc(x.question||('Carte '+(i+1)))}</div><div class="face back">${esc(x.answer||'')}</div></div></div>`).join('')}</div>`}
function showQuiz(raw){let d=safeJSON(raw);quiz=d.questions||[];qi=0;score=0;showQ()}
function showQ(){if(qi>=quiz.length){$("out").innerHTML=`<div class=topline><h2>🎉 Quiz terminé</h2><button class=restart onclick="location.reload()">🔄 Nouveau</button></div><h3>Score : ${score} / ${quiz.length}</h3><p>Tu peux refaire le quiz pour t’entraîner.</p><button class=next onclick="qi=0;score=0;showQ()">🔄 Refaire le quiz</button>`;return}let x=quiz[qi];$("out").innerHTML=`<div class=topline><h2>🎯 Question ${qi+1} / ${quiz.length}</h2><span class=status>Score : ${score}</span></div><div style="font-size:22px;font-weight:bold;margin:25px 0">${esc(x.question)}</div><div class=answers>${x.choices.map((v,i)=>`<button class=ans onclick="answer(this,${i})">${esc(v)}</button>`).join('')}</div><div class=feedback id=fb></div><button class=next id=nxt disabled onclick="qi++;showQ()">Question suivante ➜</button>`}
function answer(b,i){document.querySelectorAll('.ans').forEach(x=>x.disabled=true);const x=quiz[qi],ok=i===x.answer;if(ok){score++;b.style.borderColor='#16a34a';$("fb").textContent='✅ Correct ! '+(x.explanation||'')}else{b.style.borderColor='#dc2626';$("fb").textContent='❌ Mauvaise réponse. '+(x.explanation||'')}$("nxt").disabled=false}
</script>
</body></html>
